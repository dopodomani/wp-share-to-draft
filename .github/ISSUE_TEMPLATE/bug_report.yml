name: Bug report
description: Something in the WordPress plugin or Android app isn't working as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - WordPress plugin (wordpress-plugin/)
        - Android app (android/)
        - Docs
        - CI / release workflow
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Plugin version, app version, or commit SHA you're running.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: WordPress version/host, PHP version, Android version/device, connection method (REST/XML-RPC), etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Server error logs, REST/XML-RPC error body, Android logcat. Redact URLs, credentials, and any personal data first.
      render: shell
    validations:
      required: false
