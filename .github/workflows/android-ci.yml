name: Android CI

# Supplements Phase 3b build verification for the secondary PC (no Android SDK) --
# see docs/development.md#cis-role. This is the environment that actually has the
# Android SDK, so it's what proves :app builds at all, not just that its Kotlin syntax
# and style are clean (which ktlint alone can already confirm without the SDK).
#
# Deliberately out of scope here: emulator/instrumented tests, real-device Share Target
# behavior, and real WordPress smoke testing -- those are Phase 4 (see
# docs/phase2-smoke-test-guide.md and ROADMAP.md's Phase 4 gate), not this workflow.

# Triggers on every push to main and every PR, unconditionally -- no path filter here.
# The "Android CI" job at the bottom of this file is the required status check on
# `main`'s branch ruleset, and GitHub only ever satisfies a required check from a check
# run that actually gets created; a path-filtered trigger meant docs-only PRs got no
# check run at all and sat permanently blocked. Instead, the `changes` job below detects
# whether android/** was touched, the real build-and-test job is skipped (not silently
# absent) when it wasn't, and the "Android CI" gate job reports success either way --
# GitHub treats a skipped job as satisfying a required check.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - "android/**"
              - ".github/workflows/android-ci.yml"

  build-and-test:
    name: Build and test (Android SDK, Ubuntu)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. JDK -- 17, matching this project's compileOptions/kotlinOptions target
      # (see android/core/build.gradle.kts, android/app/build.gradle.kts) and AGP 8.5's
      # recommended baseline.
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK -- platform/build-tools only, no emulator/system-image (this
      # workflow never runs instrumented tests). No secrets involved: this is a public
      # SDK download, not a signed/licensed credential. android-actions/setup-android
      # installs the cmdline-tools and accepts licenses, which would let AGP
      # lazily auto-download compileSdk 35's platform/build-tools on first use --
      # but that lazy path depends on network timing during the build itself, so the
      # exact packages this project needs (matching android/app/build.gradle.kts'
      # compileSdk/targetSdk = 35) are installed explicitly and up front instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install required Android SDK packages (compileSdk 35)
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Fixes the executable bit lost when gradlew was first committed from Windows,
      # and the eol=lf .gitattributes rule keeps the shebang line itself intact --
      # belt-and-suspenders so a future re-commit from Windows can't silently break this.
      - name: Ensure gradlew is executable
        working-directory: android
        run: chmod +x ./gradlew

      # 4. Verify the committed gradle-wrapper.jar matches Gradle's known-good checksums,
      # before trusting it to execute anything.
      #
      # Intentionally kept alongside gradle/actions/setup-gradle below rather than
      # relying on that action alone: wrapper-validation is a small, fast,
      # single-purpose security check with its own clearly-labeled step in the Actions
      # log, so a failure here is unambiguous and instant. setup-gradle's own
      # provenance/verification behavior is about the Gradle *distribution* it
      # downloads, not a guarantee about this repo's committed wrapper jar being
      # unmodified -- the two checks aren't actually the same thing, so this isn't
      # redundant, but even if a future setup-gradle version did overlap, this step
      # is cheap enough to keep on purpose for the explicit, visible pass/fail signal.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # 5. Gradle cache (dependencies + build cache), handled by the official action --
      # also transparently uses the validated wrapper for every ./gradlew call below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # 6. :core unit tests -- plain JVM module, no Android SDK actually required for
      # this step, but it runs here too so the whole matrix of checks lives in one place.
      - name: ":core unit tests"
        working-directory: android
        run: ./gradlew :core:test --no-daemon

      # 7. :core ktlint
      - name: ":core ktlint"
        working-directory: android
        run: ./gradlew :core:ktlintCheck --no-daemon

      # 8. :app JVM unit tests (ViewModels, plus Robolectric-based IntentParserTest /
      # EncryptedSettingsRepositoryTest -- these need the Android SDK, which is why this
      # step could not run on the secondary PC).
      - name: ":app unit tests"
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # 9. :app Android Lint
      - name: ":app Android Lint"
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      # 10. :app assembleDebug -- the actual compile-and-package step that needs the
      # Android SDK; this is what could not be verified on the secondary PC.
      - name: ":app assembleDebug"
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  # The actual required status check on `main` (see docs/development.md#cis-role).
  # Named to match the ruleset entry regardless of which jobs above ran, so a docs-only
  # PR -- where build-and-test is skipped -- still reports success here, while a PR that
  # touches android/** only passes if build-and-test genuinely succeeded.
  android-ci:
    name: Android CI
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [ "${{ needs.changes.outputs.android }}" = "true" ] && [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "build-and-test did not succeed (${{ needs.build-and-test.result }})"
            exit 1
          fi
          echo "OK"
