name: WordPress CI

on:
  push:
    branches: [main]
    paths:
      - "wordpress-plugin/**"
      - ".github/workflows/wordpress-ci.yml"
  pull_request:
    paths:
      - "wordpress-plugin/**"
      - ".github/workflows/wordpress-ci.yml"

concurrency:
  group: wordpress-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    defaults:
      run:
        working-directory: wordpress-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('wordpress-plugin/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: composer test

  coding-standards:
    name: Composer validation and PHPCS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wordpress-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.1-${{ hashFiles('wordpress-plugin/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.1-

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP CodeSniffer
        run: composer lint
