name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress:
    name: Package WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        working-directory: wordpress-plugin
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test and lint plugin
        working-directory: wordpress-plugin
        run: |
          composer test
          composer lint

      - name: Build installable ZIP
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          bash wordpress-plugin/scripts/build-release.sh dist "material-capture-${version}.zip"

      - name: Verify ZIP layout and plugin loading
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'material-capture-*.zip' -print -quit)"
          test -n "${archive}"
          unzip -q "${archive}" -d dist/extracted
          test -f dist/extracted/material-capture/material-capture.php
          test -f dist/extracted/material-capture/vendor/autoload.php
          test ! -e dist/extracted/material-capture/tests
          test ! -e dist/extracted/material-capture/composer.json
          php wordpress-plugin/scripts/verify-release.php dist/extracted/material-capture

      - name: Upload WordPress artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordpress-release
          path: dist/material-capture-*.zip
          if-no-files-found: error

  android:
    name: Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test, lint, and build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :core:ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Stage APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/wp-share-to-draft-${version}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist/wp-share-to-draft-*.apk
          if-no-files-found: error

  publish:
    name: Publish release bundle
    needs: [wordpress, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.zip *.apk > SHA256SUMS

      - name: Upload complete release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
          fi
