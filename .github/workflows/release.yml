name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress:
    name: Package WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        working-directory: wordpress-plugin
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test and lint plugin
        working-directory: wordpress-plugin
        run: |
          composer test
          composer lint

      - name: Build installable ZIP
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          bash wordpress-plugin/scripts/build-release.sh dist "material-capture-${version}.zip"

      - name: Verify ZIP layout and plugin loading
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'material-capture-*.zip' -print -quit)"
          test -n "${archive}"
          unzip -q "${archive}" -d dist/extracted
          test -f dist/extracted/material-capture/material-capture.php
          test -f dist/extracted/material-capture/vendor/autoload.php
          test ! -e dist/extracted/material-capture/tests
          test ! -e dist/extracted/material-capture/composer.json
          php wordpress-plugin/scripts/verify-release.php dist/extracted/material-capture

      - name: Upload WordPress artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-release
          path: dist/material-capture-*.zip
          if-no-files-found: error

  android:
    name: Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Test, lint, and build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :core:ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Stage APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/wp-share-to-draft-${version}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/wp-share-to-draft-*.apk
          if-no-files-found: error

  publish:
    name: Publish release bundle
    needs: [wordpress, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.zip *.apk > SHA256SUMS

      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
          fi
