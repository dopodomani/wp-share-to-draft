version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      android-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - android
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /wordpress-plugin
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    groups:
      wordpress-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - wordpress
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
